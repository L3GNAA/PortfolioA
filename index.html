<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angel Contreras — Netflix-style</title>
  <meta name="color-scheme" content="dark">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #141414;
      --ink: #fff;
      --muted: #e5e5e5;
      --ink-2: #b3b3b3;
      --panel: #000;
      --accent: #E50914;
      --rail: #1a1a1a;
      --thumb: #4a4a4a;
      --ring: rgba(255,255,255,.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      scroll-behavior: auto;
      overflow-y: hidden;
      position: relative;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      position: relative;
    }

    .nf {
      font-family: "Netflix Sans","Bebas Neue",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
      letter-spacing: .015em;
      text-transform: uppercase;
    }

    /* Intro overlay */
    .netflix-intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      z-index: 10000;
      cursor: pointer;
    }

    .netflix-logo {
      display: grid;
      place-items: center;
      animation: logoZoom 1.8s ease both;
      text-align: center;
    }

    .intro-text {
      font-family: "Netflix Sans","Bebas Neue",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
      font-weight: 900;
      font-size: clamp(48px, 12vw, 140px);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #E50914;
      margin: 0;
      text-shadow: 0 0 20px rgba(229,9,20,.6), 0 0 40px rgba(229,9,20,.4), 0 0 60px rgba(229,9,20,.2);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: baseline;
    }

    .intro-text span {
      display: inline-block;
      position: relative;
    }

    /* individual letter animation offsets */
    .intro-text span:nth-child(1) { transform: translateY(30px); }
    .intro-text span:nth-child(2) { transform: translateY(20px); }
    .intro-text span:nth-child(3) { transform: translateY(12px); }
    .intro-text span:nth-child(4) { transform: translateY(7px); }
    .intro-text span:nth-child(5) { transform: translateY(3px); }
    .intro-text span:nth-child(6) { transform: translateY(1px); }
    .intro-text span:nth-child(7),
    .intro-text span:nth-child(8) { transform: translateY(0px); }
    .intro-text span:nth-child(9) { transform: translateY(1px); }
    .intro-text span:nth-child(10) { transform: translateY(3px); }
    .intro-text span:nth-child(11) { transform: translateY(7px); }
    .intro-text span:nth-child(12) { transform: translateY(12px); }
    .intro-text span:nth-child(13) { transform: translateY(20px); }
    .intro-text span:nth-child(14) { transform: translateY(30px); }
    .intro-text span:nth-child(15) { transform: translateY(40px); }

    @keyframes logoZoom {
      0% { transform: scale(.6); opacity: 0; }
      55% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes hideIntro {
      to { opacity: 0; visibility: hidden; }
    }

    /* Profiles section */
    .profiles {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9000;
    }

    .profiles.show {
      display: flex;
      animation: fadeIn .35s ease both;
    }

    .profiles-wrap {
      width: min(1000px, 92vw);
      margin: auto;
      text-align: center;
    }

    .profiles h2 {
      font: 900 clamp(20px,3.2vw,32px)/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
      margin: 0 0 22px;
    }

    .grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(3, minmax(0,1fr));
      place-items: center;
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 14px;
      }
    }

    .tile {
      display: grid;
      gap: 10px;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      outline: none;
      background: transparent;
      border: 0;
    }

    .tile.disabled { cursor: not-allowed; }

    .avatar {
      width: min(32vw, 180px);
      height: min(32vw, 180px);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      box-shadow: 0 0 0 0 rgba(255,255,255,0);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease, filter .12s ease;
      display: grid;
      place-items: center;
    }

    .tile:not(.disabled):hover .avatar,
    .tile:not(.disabled):focus .avatar {
      transform: scale(1.04);
      border-color: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,.12);
      filter: brightness(1.06);
    }

    .tile.disabled .avatar {
      filter: grayscale(1) brightness(.75);
      border-color: transparent;
    }

    .label {
      font-weight: 800;
      color: #a3a3a3;
      letter-spacing: .04em;
      font-size: 14px;
    }

    .av-recruiter { background: linear-gradient(180deg,#0DB5FF,#0070F3); }
    .av-family { background: linear-gradient(180deg,#25E26A,#0AA84B); }
    .av-guest { background: linear-gradient(180deg,#FFB21E,#FF7A00); }

    .icon { width: 56%; height: 56%; display: block; }
    .icon svg { width: 100%; height: 100%; fill: #fff; }

    .hide { display: none !important; }
    .main { opacity: 0; }
    .main.show { animation: fadeIn .6s ease forwards; }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Navbar, hero, sections, footer, etc. remain unchanged for brevity... */
  </style>
</head>

<body>
  <!-- Netflix-style intro -->
  <div class="netflix-intro" id="clickableIntro" role="button" tabindex="0" aria-label="Enter — click to continue" aria-hidden="false">
    <div class="netflix-logo" aria-label="ANGEL CONTRERAS">
      <h1 class="intro-text">
        <span>A</span><span>N</span><span>G</span><span>E</span><span>L</span>
        <span style="margin-right:0.3em;"> </span>
        <span>C</span><span>O</span><span>N</span><span>T</span><span>R</span><span>E</span><span>R</span><span>A</span><span>S</span>
      </h1>
      <p style="color:white; font-size:14px; margin-top:6px; text-align:center; font-weight:400;">Tap / Click</p>
    </div>
  </div>

  <!-- Profiles section -->
  <div id="profiles" class="profiles" role="dialog" aria-labelledby="whosWatching" aria-modal="true">
    <div class="profiles-wrap">
      <h2 id="whosWatching" class="nf">Who's watching?</h2>
      <div class="grid">
        <!-- Profile tiles: recruiter, family, guest -->
        <!-- …existing tiles… -->
      </div>
    </div>
  </div>

  <div class="main" id="appRoot">
    <!-- Navbar, hero, sections, footer go here -->
    <!-- …existing content… -->
  </div>

  <script>
    // JS logic remains the same
    // e.g., intro click, profiles toggle, rails scroll, etc.
  </script>
</body>
</html>
